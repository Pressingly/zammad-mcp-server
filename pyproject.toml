[project]
name = "zammad-mcp-server"
version = "0.1.0"
description = "A Model Context Protocol server for the Zammad helpdesk, authenticated per user"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pressingly" }]
keywords = ["mcp", "zammad", "fastmcp", "helpdesk", "support"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastmcp==3.4.7",
    "mcp==1.26.0",
    "httpx>=0.27",
    "pydantic>=2",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
platform = [
    "redis>=5",
    "cryptography",
    "pyjwt>=2",
    "authlib>=1.6.9",
    "py-key-value-aio[redis]>=0.4.4,<0.5.0",
]

[project.urls]
Repository = "https://github.com/Pressingly/zammad-mcp-server"
Issues = "https://github.com/Pressingly/zammad-mcp-server/issues"

[project.scripts]
zammad-mcp = "zammad_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "fakeredis[lua]>=2.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zammad_mcp"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["zammad_mcp"]

[tool.coverage.report]
show_missing = true
exclude_also = ['if __name__ == "__main__":']
